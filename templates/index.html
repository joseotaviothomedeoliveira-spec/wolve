<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador de Atividades A4</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 720px;
        margin: 24px auto;
        padding: 0 16px;
      }
      h1 {
        color: #1a365d;
      }
      form {
        display: grid;
        gap: 12px;
        padding: 16px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
      }
      label {
        display: grid;
        gap: 6px;
        font-weight: 600;
      }
      input, textarea, button {
        font: inherit;
        padding: 8px;
      }
      button {
        background: #1a365d;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      p {
        color: #374151;
      }
    </style>
  </head>
  <body>
    <h1>Gerador de Atividades em PDF (A4)</h1>
    <p>
      Crie folhas de trabalho para professoras em Portugal para alunos do 1º ao
      {{ max_ano }}º ano.
    </p>

    <form action="/gerar-pdf" method="post">
      <label>
        Disciplina
        <input name="disciplina" type="text" placeholder="Ex.: Matemática" required />
      </label>

      <label>
        Ano escolar (1 a {{ max_ano }})
        <input name="ano" type="number" min="1" max="{{ max_ano }}" required />
      </label>

      <label>
        Tema
        <input name="tema" type="text" placeholder="Ex.: Frações" required />
      </label>

      <label>
        Objetivo da atividade
        <textarea name="objetivo" rows="3" placeholder="Ex.: Consolidar frações equivalentes" required></textarea>
      </label>

      <label>
        Quantidade de questões (1 a 20)
        <input name="quantidade" type="number" min="1" max="20" value="8" required />
      </label>

      <button type="submit">Gerar PDF</button>
    </form>
  </body>
</html>
